<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career tracker demo</title>
  <meta name="description" content="EA FC 27 career-mode tracker: Manchester United under Justin Dixon.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="img/crests/11.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/viz.css">
  <link rel="stylesheet" href="css/views-home.css">
  <link rel="stylesheet" href="css/views-home-pre.css">
  <link rel="stylesheet" href="css/views-squad.css">
  <link rel="stylesheet" href="css/views-match.css">
  <link rel="stylesheet" href="css/views-misc.css">
  <link rel="stylesheet" href="css/views-match-rich.css">
  <link rel="stylesheet" href="css/phone-views.css">
  <link rel="stylesheet" href="css/phone.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="mast">
    <div class="floodlights" aria-hidden="true"></div>
    <div class="mast-inner" id="mast"></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <div class="watermark" aria-hidden="true"></div>
  <footer class="foot">
    <p>Career tracker for an EA FC 27 save.</p><p>Portraits and crests: SoFIFA.</p>
  </footer>

  <aside id="drawer" class="drawer" hidden aria-label="Player profile">
    <div class="drawer-scrim"></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Player profile">
      <button class="drawer-close" type="button" aria-label="Close player profile">Close</button>
      <div class="drawer-body"></div>
    </div>
  </aside>

  <script src="data/demo.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/tooltip.js"></script>
  <script src="js/core/nav.js"></script>
  <script src="js/core/pitch.js"></script>
  <script src="js/core/charts.js"></script>
  <script src="js/core/charts2.js"></script>
  <script src="js/core/stats.js"></script>
  <script src="js/core/gamepitch.js"></script>
  <script src="js/views/home-pre.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/squad.js"></script>
  <script src="js/views/player.js"></script>
  <script src="js/views/player-season.js"></script>
  <script src="js/views/match.js"></script>
  <script src="js/views/match-parts.js"></script>
  <script src="js/views/match-rich.js"></script>
  <script src="js/views/match-player.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/league.js"></script>
  <script src="js/views/transfers.js"></script>
  <script src="js/views/finances.js"></script>
  <script src="js/views/youth.js"></script>
  <script src="js/views/room.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
